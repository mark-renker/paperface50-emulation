# Tag v* -> macOS universal .pkg installer (+ raw bundles zip) and a Windows zip, attached to a GitHub Release.
name: release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal; JUCE 8.0.6 via FetchContent)
        run: cmake -B build-universal -DCMAKE_BUILD_TYPE=Release && cmake --build build-universal -j 4 --target Paperface50_AU Paperface50_VST3 Paperface50_Standalone Paperface50FX_AU Paperface50FX_VST3 Paperface50FX_Standalone
      - name: Package installer
        run: packaging/make_installer.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }
  windows:
    runs-on: windows-2022
    continue-on-error: true   # never built with MSVC before; a failure here must not block the macOS download
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel --target Paperface50_VST3 Paperface50_Standalone Paperface50FX_VST3 Paperface50FX_Standalone
      - shell: bash
        run: |
          VERSION=$(sed -n 's/^project(SergePaperface50 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          OUT="Paperface 50 $VERSION (Windows)"; mkdir -p "$OUT" dist
          cp -R "build/Paperface50_artefacts/Release/VST3/Paperface 50.vst3" "$OUT/"
          cp -R "build/Paperface50FX_artefacts/Release/VST3/Paperface 50 FX.vst3" "$OUT/"
          cp "build/Paperface50_artefacts/Release/Standalone/Paperface 50.exe" "$OUT/"
          cp "build/Paperface50FX_artefacts/Release/Standalone/Paperface 50 FX.exe" "$OUT/"
          cp packaging/INSTALL-Windows.txt "$OUT/INSTALL.txt"
          7z a "dist/Paperface50-$VERSION-Windows-x64.zip" "$OUT"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
  publish:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success'
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
