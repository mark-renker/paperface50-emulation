<h2>Installed</h2>
<p>Rescan plug-ins in your DAW (Logic scans on launch; Live: Preferences &gt; Plug-Ins &gt; Rescan; Reaper:
Preferences &gt; Plug-ins &gt; Re-scan). Look under <b>Black Tie Ventures &gt; Paperface 50</b> /
<b>Paperface 50 FX</b>. Drag banana cables between jacks to make a patch; nothing sounds unpatched.</p>
</body></html>
